name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup update nightly
      - run: rustup update 1.76 && rustup default 1.76
      # Only the library is subject to the MSRV. Drop the workspace so
      # sunspec-gen and the examples don't affect dependency resolution.
      - run: sed -i '/^\[workspace\]/,/^\]/d' Cargo.toml
      - run: cargo +nightly update -Z minimal-versions
      - run: cargo check --all-features

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: cargo build --verbose --all-features --workspace
    - name: Run tests
      run: cargo test --verbose --all-features

  codegen:
    name: Check generated models
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
    - run: cargo models check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: cargo fmt --all --check
    - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - run: cargo doc --no-deps --all-features
      env:
        RUSTDOCFLAGS: -D warnings

  features:
    name: Check feature combinations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "tokio"
          - "tokio-modbus,model1"
          - "serde,model1"
    steps:
    - uses: actions/checkout@v5
    - run: cargo clippy -p sunspec --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
    - run: cargo test -p sunspec --no-default-features --features "${{ matrix.features }}"
